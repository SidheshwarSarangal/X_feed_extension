<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Allow Access</title>
    <link rel="stylesheet" href="allow-access.css" />
  </head>
  <body>
    <a href="main.html" class="back-link">← Back</a>

    <div class="container">
      <h1 class="title">Allow Access to Feed</h1>
      <p class="subtitle">Enter your details to enable access:</p>

      <!-- ❌ Removed form tag to prevent reload -->
      <div id="access-form">
        <input id="username" type="text" placeholder="Username" required />
        <input id="email" type="email" placeholder="Email" required />
        <input id="password" type="password" placeholder="Password" required />
        <button id="submit-btn">Submit</button>
      </div>

      <div id="loading" style="display: none">Loading...</div>
      <div id="result"></div>

      <script src="allow-access.js"></script>
    </div>
  </body>
</html>
